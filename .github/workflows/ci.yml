name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Size summary
        if: always()
        run: |
          echo "## Top 10 archivos más grandes" >> $GITHUB_STEP_SUMMARY
          find src -name '*.tsx' -o -name '*.ts' | xargs wc -l 2>/dev/null | sort -rn | head -10 >> $GITHUB_STEP_SUMMARY

  push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compute image tag
        id: tag
        run: |
          REF="${GITHUB_REF#refs/heads/}"
          if [ "$REF" = "main" ]; then
            echo "value=main" >> "$GITHUB_OUTPUT"
          else
            SLUG="${REF#feature/}"
            SLUG="${SLUG//\//-}"
            SLUG="$(echo "$SLUG" | tr '[:upper:]' '[:lower:]')"
            SLUG="${SLUG:0:121}-dev"
            echo "value=${SLUG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/ossflow-frontend:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
